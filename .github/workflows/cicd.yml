name: Corporate DevSecOps Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: python-demo

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:

  ci-cd:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8 coverage

    - name: Lint Code
      run: |
        flake8 .

    - name: Run Unit Tests
      run: |
        pytest

    - name: Generate Coverage
      run: |
        coverage run -m pytest
        coverage xml

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    - name: Build Artifact
      run: |
        mkdir artifact
        cp -R app artifact/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-build
        path: artifact

    - name: Authenticate To GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Setup GCloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: |
        gcloud auth configure-docker us-east4-docker.pkg.dev --quiet

    - name: Build Docker Image
      run: |
        docker build \
        -t us-east4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demo-repo/python-demo:${{ github.sha }} .

    - name: Scan Docker Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: us-east4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demo-repo/python-demo:${{ github.sha }}

    - name: Push Docker Image
      run: |
        docker push \
        us-east4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demo-repo/python-demo:${{ github.sha }}

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: demo-cluster
        location: us-east4-a

    - name: Deploy To Kubernetes
      run: |
        kubectl set image deployment/python-demo \
        python-demo=us-east4-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demo-repo/python-demo:${{ github.sha }}

    - name: Verify Deployment
      run: |
        kubectl rollout status deployment/python-demo
