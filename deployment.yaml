apiVersion: apps/v1

kind: Deployment

metadata:
  name: python-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-demo

  template:
    metadata:
      labels:
        app: python-demo

    spec:
      containers:

      - name: python-demo

        image: us-east4-docker.pkg.dev/PROJECT/demo-repo/python-demo:latest

        ports:
        - containerPort: 5000
